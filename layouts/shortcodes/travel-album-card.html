<div class="travel-album-entry">
<a class="travel-album-card" href="{{ .Get `link` | relURL }}">
  <div class="travel-album-image">
    <img src="{{ .Get `image` }}" alt="{{ .Get `title` }}" loading="lazy" decoding="async" />
  </div>
  <div class="travel-album-caption">
    <span class="travel-album-title">{{ .Get "title" }}</span>
    <svg class="travel-album-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19 19 5M5 5h14v14" /></svg>
  </div>
</a>
</div>
