# 站点基础设置
baseURL = "https://toudens.github.io/"
languageCode = "zh-cn"
title = "偷一偷的偷学小窝"
theme = "hextra"
defaultContentLanguage = "zh-cn"

# 启用关键功能
enableRobotsTXT = true
enableGitInfo = false
enableEmoji = true
hasCJKLanguage = true
enableInlineShortcodes = true

# 输出配置
[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML", "Markdown"]
  section = ["HTML", "RSS", "Markdown"]

# 多语言配置
[languages.zh-cn]
  languageName = "简体中文"
  languageCode = "zh-CN"
  weight = 1
  title = "偷一偷的偷学小窝"
  
  [languages.zh-cn.params]
    [languages.zh-cn.params.page.contextMenu]
      links = [
        { name = "在 ChatGPT 中打开", icon = "chatgpt", url = "..." }
      ]

# 主题参数配置
[params]
  sidebar = { collapsed = false }
  navbar = { displayTitle = true, displayLogo = true }

[params.page]
  # 选项: "normal" (默认), "wide" (较宽), "full" (全屏)
  width = "normal"

# 数学公式渲染
[params.math]
  enable = true
  engine = "katex"
  # 如果默认 CDN 慢，可以换成国内源
[params.math.katex]
  base = "https://cdn.staticfile.net/KaTeX/0.16.9/"

  
[params.flexsearch]
  index = "content"
  tokenize = "forward"

[params.editURL]
  enable = true
  base = "https://github.com/Toudens/Toudens.github.io/edit/main/content"
  

[params.page.contextMenu]
  links = [
    { name = "在 ChatGPT 中打开", icon = "chatgpt", url = "..." }
  ]

[params.toc]
  enable = true

# 模块配置
[module]
  [module.hugoVersion]
    extended = true
    min = "0.146.0"
  [[module.imports]]
    path = "github.com/imfing/hextra"

# Markdown 渲染配置（关键部分）
[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [["$$", "$$"]]
        inline = [["$", "$"]]

# 菜单配置
[menu]
  [[menu.main]]
    identifier = "phymath"
    name = "数理方法"
    pageRef = "/phymath"
    weight = 1
  
  [[menu.main]]
    identifier = "compsci"
    name = "计算机科学"
    pageRef = "/compsci"
    weight = 2
  
  [[menu.main]]
    identifier = "acee"
    name = "工高课程"
    pageRef = "/acee"
    weight = 3
  
  [[menu.main]]
    identifier = "ttneed"
    name = "偷一偷QwQ"
    pageRef = "/ttneed"
    weight = 4
  
  [[menu.main]]
    name = "搜索"
    weight = 5
    [menu.main.params]
      type = "search"
  
  [[menu.main]]
    name = "GitHub"
    weight = 6
    url = "https://github.com/Toudens/Toudens.github.io"
    [menu.main.params]
      icon = "github"