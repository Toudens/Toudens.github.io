{{/* Inline search paired with assets/js/flexsearch.js; styled locally so theme
     updates cannot replace the input or remove dropdown styles. */}}
{{- $placeholder := (T "searchPlaceholder") | default "Search..." -}}
<div class="hextra-search-wrapper">
  <div>
    <input
      placeholder="{{ $placeholder }}"
      aria-label="{{ $placeholder }}"
      class="hextra-search-input"
      type="search"
      autocomplete="off"
      spellcheck="false"
    />
    <kbd>CTRL K</kbd>
  </div>
  <div>
    <ul class="hextra-search-results hextra-scrollbar hx:hidden"
        aria-label="{{ (T "searchResults") | default "Search results" }}"></ul>
    <div class="hextra-search-status" aria-live="polite" role="status"></div>
  </div>
</div>
