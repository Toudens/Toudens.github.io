name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# 全局开启 Node 24 支持，消除弃用警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.20.0'
          cache: false # 💡 关键：关闭默认缓存，防止出现 "tar failed with exit code 2"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # 💡 建议固定版本，与你的 hugo.toml 中的 min = "0.146.0" 匹配
          hugo-version: '0.146.0' 
          extended: true
          
      - name: Install dependencies
        run: hugo mod get -u # 确保 Hugo Modules (Hextra 主题) 成功拉取

      - name: Build with Hugo
        run: hugo --gc --minify
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy_pages.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deploy_pages
        uses: actions/deploy-pages@v4