{{- $current := .current -}}
{{- $root := .root -}}
<ul>
  {{ range $root.RegularPagesRecursive.ByWeight }}
    {{ if or .Draft .Params.sidebar.exclude }}{{ continue }}{{ end }}
    <li>
      <div class="toudens-tree-row">
        <a href="{{ .RelPermalink }}"{{ if eq .RelPermalink $current.RelPermalink }} class="hextra-sidebar-active-item" aria-current="page"{{ end }}>{{ .LinkTitle }}</a>
      </div>
    </li>
  {{ end }}
</ul>
