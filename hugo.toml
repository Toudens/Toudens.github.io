# 站点基础设置
baseURL = "https://toudens.github.io/"
locale = "zh-cn"
title = "偷一偷的偷学小窝"
defaultContentLanguage = "zh-cn"

# 启用关键功能
enableRobotsTXT = true
enableGitInfo = false
enableEmoji = true
hasCJKLanguage = true
enableInlineShortcodes = true

# 输出配置
[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML", "Markdown"]
  section = ["HTML", "RSS", "Markdown"]

# 多语言配置
[languages.zh-cn]
  label = "简体中文"
  locale = "zh-CN"
  weight = 1
  title = "偷一偷的偷学小窝"
  
  [languages.zh-cn.params]
    [languages.zh-cn.params.page.contextMenu]
      links = [
        { name = "在 ChatGPT 中打开", icon = "chatgpt", url = "..." }
      ]

# 主题参数配置
[params]
  sidebar = { collapsed = false }
  navbar = { displayTitle = true, displayLogo = true }

[params.page]
  # 选项: "normal" (默认), "wide" (较宽), "full" (全屏)
  width = "normal"

[params.math]
  enable = true
  engine = "mathjax"
  
#[params.math.katex]
# 使用 unpkg 或者 jsdelivr，这两个在国内目前相对稳定
#  base = "https://unpkg.com/katex@0.16.11/dist/"

  
[params.search.flexsearch]
  index = "content"
  tokenize = "forward"

[params.editURL]
  enable = true
  base = "https://github.com/Toudens/Toudens.github.io/edit/main/content"
  

[params.page.contextMenu]
  links = [
    { name = "在 ChatGPT 中打开", icon = "chatgpt", url = "..." }
  ]

[params.toc]
  enable = true

# 模块配置
[module]
  [module.hugoVersion]
    extended = true
    min = "0.146.0"
  [[module.imports]]
    path = "github.com/imfing/hextra"

# Markdown 渲染配置（关键部分）
[markup]
  [markup.highlight]
    noClasses=true
    style="github"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true # 允许 HTML
      hardWraps = false  # 开启硬换行
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          # 修改为正确的 TOML 配置：[markup.goldmark.extensions.passthrough.delimiters]
           block = [['$$', '$$'], ['\[', '\]']]
            inline = [['$', '$'], ['\(', '\)']]

# 菜单配置
[menu]
  [[menu.main]]
    identifier = "mathtech"
    name = "数理技术"
    pageRef = "/mathtech"
    weight = 1

  [[menu.main]]
    identifier = "papers"
    name = "论文阅读"
    pageRef = "/papers"
    weight = 2

  [[menu.main]]
    identifier = "travel"
    name = "旅行影集"
    pageRef = "/travel"
    weight = 3

  [[menu.main]]
    identifier = "friends"
    name = "友邻小站"
    pageRef = "/friends"
    weight = 4

[params.comments]
  enable = true
  type = "giscus"

[params.comments.giscus]
  repo = "Toudens/toudens-blog-comments"
  repoId = "R_kgDOR2lW9g"
  category = "Announcements"
  categoryId = "DIC_kwDOR2lW9s4C5wBU"
  mapping = "pathname"
  strict = "0"
  reactionsEnabled = "0"
  emitMetadata = "0"
  inputPosition = "top"
  theme = "preferred_color_scheme"
  lang = "zh-CN"
  loading = "lazy"
